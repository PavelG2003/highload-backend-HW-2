spring:
  application:
    name: event-pipeline
  main:
    web-application-type: none
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092,localhost:39092,localhost:49092}
    producer:
      client-id: ${PRODUCER_ID:producer-local}
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false
        linger.ms: 0
        request.timeout.ms: 10000
        delivery.timeout.ms: 30000
        max.block.ms: 10000
    consumer:
      group-id: events-processor
      client-id: ${CONSUMER_ID:consumer-local}
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  role: ${APP_ROLE:producer}
  producer:
    id: ${PRODUCER_ID:producer-local}
    events-per-second: ${EVENTS_PER_SECOND:20}
    users-per-producer: ${USERS_PER_PRODUCER:12}
    key-mode: ${KEY_MODE:user_id}
  consumer:
    id: ${CONSUMER_ID:consumer-local}
    processing-delay-ms: ${PROCESSING_DELAY_MS:20}
    dlt-topic: events.dlt
  verify:
    github-login: ${GITHUB_LOGIN:PavelG2003}
  sink:
    url: ${SINK_JDBC_URL:jdbc:postgresql://localhost:5433/${POSTGRES_DB:events}}
    username: ${POSTGRES_USER:events}
    password: ${POSTGRES_PASSWORD:events-local}
